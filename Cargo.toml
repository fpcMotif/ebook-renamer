[package]
name = "ebook_renamer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
colored = "2.1"
ratatui = "0.29.0"
crossterm = "0.29.0"
strsim = "0.11"
toml = "0.8"
reqwest = { version = "0.11", features = ["json", "blocking"] }
quick-xml = "0.31"
lopdf = "0.33"
dirs = "5.0"
zip = "2.1"
urlencoding = "2.1"
once_cell = "1.19"
csv = "1.3"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.8"
